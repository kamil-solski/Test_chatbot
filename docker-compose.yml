services:
  redis:
    image: redis:8.0-alpine
    restart: unless-stopped

  litellm:
    image: litellm/litellm:main-v1.83.7-stable
    env_file: .env
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - LITELLM_BASE_URL=http://litellm:4000/v1
    ports:
      - "8000:8000"     # exposed for direct dev access / Live Server mode
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    depends_on:
      - redis
      - litellm
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/templates/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/src/script.js:/usr/share/nginx/html/src/script.js:ro
      - ./frontend/static:/usr/share/nginx/html/static:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
