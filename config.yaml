# Application behavior config.
#
# This file is for the backend service only — credentials and deployment URLs
# live in .env (read as environment variables). LiteLLM proxy has its own config
# in litellm_config.yaml (different consumer, different schema).
#
# Mounted into the backend container at /app/config.yaml (see docker-compose.yml).

llm:
  default_model: gpt-4o-mini
  temperature: 0.0
  system_prompt: "You are a helpful assistant."

embeddings:
  provider: openai                                              # openai | local switcher
  model: text-embedding-3-small                                 # used by openai provider
  model_name: sentence-transformers/all-MiniLM-L6-v2            # used by local provider

history:
  strategy: smart                                               # full | trim | summarize | rag | smart
  max_tokens: 1000                                              # trim
  summarize_after: 3                                            # summarize: message count threshold
  rag_top_k: 4                                                  # rag / smart: top-k retrieved messages
  window_size: 6                                                # smart: sliding window length
  chunk_size: 6                                                 # smart: messages per summary chunk
  topic_naming_model: gpt-4o-mini                               # smart: cheap LLM for cluster naming + chunk summarization
  topic_similarity_threshold: 0.65                              # smart: cosine threshold to join existing cluster

rag:
  doc_top_k: 3                                                  # document chunks injected per query

eval:
  judge_model: gpt-4o-mini                                      # LLM used for relevance / faithfulness / e2e judging

logging:
  chat_log: logs/chat.log                                       # per-turn NDJSON

